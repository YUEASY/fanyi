<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>牛逼翻译设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>启用网站</h1>
      <form id="site-form">
        <label for="site-url">页面网址</label>
        <div class="controls">
          <input id="site-url" name="site-url" type="url" placeholder="https://docs.example.com/guide" required />
          <button type="submit">启用网站</button>
        </div>
        <p id="error" role="alert" hidden></p>
      </form>
      <ul id="enabled-hosts" aria-label="已启用网站"></ul>

      <section aria-labelledby="familiar-heading">
        <h2 id="familiar-heading">熟词表</h2>
        <label for="familiar-search">搜索熟词</label>
        <input id="familiar-search" type="search" autocomplete="off" />
        <ul id="familiar-words" aria-label="熟词表"></ul>
      </section>

      <section aria-labelledby="vocab-heading">
        <h2 id="vocab-heading">生词本</h2>
        <label for="vocab-search">搜索生词</label>
        <input id="vocab-search" type="search" autocomplete="off" />
        <fieldset class="mastery-filter">
          <legend>掌握状态</legend>
          <label><input type="radio" name="mastery-filter" value="all" checked />全部</label>
          <label><input type="radio" name="mastery-filter" value="mastered" />已掌握</label>
          <label><input type="radio" name="mastery-filter" value="unmastered" />未掌握</label>
        </fieldset>
        <ul id="vocab-book" aria-label="生词本"></ul>
      </section>

      <section aria-labelledby="deepseek-heading">
        <h2 id="deepseek-heading">DeepSeek API Key</h2>
        <label for="deepseek-key">API Key</label>
        <div class="controls">
          <input id="deepseek-key" type="password" autocomplete="off" placeholder="sk-…" />
          <button id="deepseek-save" type="button">保存</button>
          <button id="deepseek-delete" type="button">删除</button>
        </div>
        <p id="deepseek-status" role="status" hidden></p>
      </section>

      <section aria-labelledby="data-heading">
        <h2 id="data-heading">数据导入导出</h2>
        <button id="export-data" type="button">导出数据</button>
        <label for="import-file">选择备份文件</label>
        <input id="import-file" type="file" accept="application/json,.json" />
        <div id="import-preview" hidden>
          <p id="import-summary"></p>
          <p id="import-warning"></p>
          <div class="controls">
            <button id="import-confirm" type="button">确认导入</button>
            <button id="import-cancel" type="button">取消</button>
          </div>
        </div>
        <p id="import-status" aria-live="polite" hidden></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
