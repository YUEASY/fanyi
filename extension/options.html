<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>牛逼翻译设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>启用网站</h1>
      <form id="site-form">
        <label for="site-url">页面网址</label>
        <div class="controls">
          <input id="site-url" name="site-url" type="url" placeholder="https://docs.example.com/guide" required />
          <button type="submit">启用网站</button>
        </div>
        <p id="error" role="alert" hidden></p>
      </form>
      <ul id="enabled-hosts" aria-label="已启用网站"></ul>
    </main>
    <script src="options.js"></script>
  </body>
</html>
